name: pages

# Build the in-browser app (Pyodide, no server) from the committed fixtures and publish it to
# GitHub Pages. The data is built by scripts/construieste_web.py --sursa fixturi, which needs
# nothing git-ignored, so the deploy is reproducible from the repo alone. No secrets, no draft
# ever leaves a visitor's browser — the page's CSP enforces it.

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "scripts/**"
      - "sources/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let an in-progress run finish rather than cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Use the dataset release if published, else the committed fixtures
        id: date
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release download date-latest --pattern date.tar.gz -O date.tar.gz 2>/dev/null; then
            mkdir -p web && tar xzf date.tar.gz -C web
            echo "sursa=gata" >> "$GITHUB_OUTPUT"
            echo "building from the collected dataset release"
          else
            echo "sursa=fixturi" >> "$GITHUB_OUTPUT"
            echo "no dataset release yet — building the 4-act fixtures demo"
          fi
      - name: Build the browser bundle
        run: uv run python -m scripts.construieste_web --sursa ${{ steps.date.outputs.sursa }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
