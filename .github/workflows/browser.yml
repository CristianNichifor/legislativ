name: Browser baseline

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.12'
      - run: uv sync --all-groups
      - run: npm ci --ignore-scripts
      - name: Local dataset controls (mocked HTTP)
        run: node tests/dataset_updates_browser.cjs
        timeout-minutes: 5
      - name: Local dataset updates (real server)
        run: node tests/local_updates_browser.cjs
        timeout-minutes: 5
      - run: npm run test:browser
        env:
          # Firefox requires HOME to belong to the container's current user.
          HOME: /root
      - run: npm run test:browser:static
        env:
          HOME: /root
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-baseline
          path: |
            test-results/
            test-results-static/
          retention-days: 7
