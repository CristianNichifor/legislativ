name = "legislativ-rescrieri"
main = "src/index.js"
compatibility_date = "2025-01-01"

# The plain-language rewrite cache. `legislativ-rescrieri`, created for this project.
[[kv_namespaces]]
binding = "RESCRIERI"
id = "8a788c5315bf4c61a72c23d3ef5f46d9"

[vars]
MISTRAL_MODEL = "mistral-small-latest"

# MISTRAL_API_KEY is a secret, not a var — never commit it. Set it with:
#   wrangler secret put MISTRAL_API_KEY
# Until it is set, the Worker returns a clearly-labelled stub and caches nothing, so the whole
# pipeline (app → Worker → KV) works end to end before any AI is wired in.
