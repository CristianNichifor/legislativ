[project]
name = "legislativ-linter"
version = "0.1.0"
description = "Linter legislativ: referințe, amendamente, obligații cu termen și vid legislativ în legislația română"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }

# Deliberately empty. Every extractor here is the standard library — re, difflib, datetime —
# because the layer that decides what a law says should not be the layer that needs a wheel to
# build. The scraper and the model client, when they exist, bring their own dependencies and
# do not belong in this package.
dependencies = []

# jsonschema and referencing are here and not in `dependencies` on purpose: a document is
# validated when it is written, not every time it is read, so the runtime footprint stays at zero.
# fonttools and brotli are here for the same reason: they only subset the webfonts, in
# `scripts/fonturi.py`, and the resulting .woff2 files are committed — so nothing the app runs,
# locally or in the browser, ever needs either.
[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "jsonschema>=4.23",
    "referencing>=0.37.0",
    "fonttools>=4.64.0",
    "brotli>=1.2.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-p no:randomly --strict-markers"
